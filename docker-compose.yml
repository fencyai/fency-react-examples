services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: fency_examples
      POSTGRES_PASSWORD: fency_examples
      POSTGRES_DB: fency_examples
    ports:
      - '10120:5432'
    volumes:
      - fency_examples_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fency_examples -d fency_examples']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fency_examples_pgdata:
